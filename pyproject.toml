[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camsentry-mcp"
version = "0.2.0"
description = "Unofficial read-only MCP server that lets a local model watch Wyze cameras, remember what they saw and text you when something matters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
keywords = ["mcp", "wyze", "camera", "ollama", "local-llm", "home-security"]
dependencies = [
    "mcp>=2.3,<3",
    "wyze-sdk>=2.3.16,<3",
    "keyring>=25",
    "httpx>=0.28,<1",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
camsentry-mcp = "camsentry_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camsentry_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

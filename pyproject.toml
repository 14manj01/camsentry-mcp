[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wyze-cam-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets a local model watch Wyze cameras and detect people, pets, packages and intruders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
keywords = ["mcp", "wyze", "camera", "ollama", "local-llm", "home-security"]
dependencies = [
    "mcp>=2.3,<3",
    "wyze-sdk>=2.3.16,<3",
    "keyring>=25",
    "httpx>=0.28,<1",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wyze-cam-mcp = "wyze_cam_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wyze_cam_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="camsentry-mcp: let a local model watch your Wyze cameras for people, pets, packages and intruders">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="420" height="260" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <!-- camera glyph -->
  <g transform="translate(72,48)">
    <rect width="60" height="60" rx="16" fill="url(#accent)"/>
    <circle cx="30" cy="30" r="15" fill="#0b1220"/>
    <circle cx="30" cy="30" r="8" fill="#22d3ee"/>
    <circle cx="34" cy="26" r="3" fill="#ecfeff"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="176" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">camsentry-mcp</text>
    <text x="72" y="218" font-size="24" fill="#a5b4c8">Let a local model watch your Wyze cameras.</text>

    <!-- detection chips -->
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="72" y="244" width="100" height="36" rx="18" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="122" y="268" fill="#67e8f9">people</text>
      <rect x="184" y="244" width="80" height="36" rx="18" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
      <text x="224" y="268" fill="#6ee7b7">pets</text>
      <rect x="276" y="244" width="118" height="36" rx="18" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="335" y="268" fill="#fcd34d">packages</text>
      <rect x="406" y="244" width="118" height="36" rx="18" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-width="1.5"/>
      <text x="465" y="268" fill="#fca5a5">intruders</text>
    </g>

    <text x="72" y="322" font-size="16" fill="#6b7c93">Vision runs on your machine  ·  Credentials stay in your OS keychain  ·  Read-only</text>

    <!-- camera frame -->
    <g transform="translate(800,50)">
      <g clip-path="url(#frame)">
        <rect width="420" height="260" fill="url(#wall)"/>
        <rect y="204" width="420" height="56" fill="#0f1a30"/>
        <!-- door -->
        <rect x="158" y="44" width="104" height="160" rx="4" fill="#24365a"/>
        <rect x="170" y="58" width="80" height="56" rx="3" fill="#1b2a47"/>
        <rect x="170" y="126" width="80" height="64" rx="3" fill="#1b2a47"/>
        <circle cx="250" cy="128" r="4" fill="#94a3b8"/>
        <!-- person -->
        <circle cx="96" cy="96" r="17" fill="#cbd5e1"/>
        <rect x="72" y="118" width="48" height="92" rx="22" fill="#cbd5e1"/>
        <!-- package -->
        <rect x="272" y="160" width="52" height="44" rx="4" fill="#d6a465"/>
        <rect x="294" y="160" width="8" height="44" fill="#b98845"/>
        <!-- dog -->
        <rect x="348" y="208" width="46" height="20" rx="10" fill="#b8aea4"/>
        <circle cx="396" cy="204" r="10" fill="#b8aea4"/>
        <rect x="390" y="190" width="6" height="10" rx="3" fill="#8f857b"/>
        <rect x="352" y="224" width="6" height="16" rx="3" fill="#b8aea4"/>
        <rect x="382" y="224" width="6" height="16" rx="3" fill="#b8aea4"/>
        <rect x="342" y="202" width="6" height="14" rx="3" fill="#b8aea4" transform="rotate(-30 345 216)"/>
      </g>
      <rect width="420" height="260" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

      <!-- detections -->
      <g font-size="13" font-weight="700" fill="#0b1220">
        <rect x="58" y="70" width="76" height="148" rx="4" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
        <rect x="58" y="50" width="62" height="20" rx="4" fill="#22d3ee"/>
        <text x="66" y="65">person</text>

        <rect x="262" y="150" width="72" height="62" rx="4" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
        <rect x="262" y="130" width="72" height="20" rx="4" fill="#fbbf24"/>
        <text x="270" y="145">package</text>

        <rect x="336" y="184" width="76" height="62" rx="4" fill="none" stroke="#34d399" stroke-width="2.5"/>
        <rect x="372" y="164" width="40" height="20" rx="4" fill="#34d399"/>
        <text x="381" y="179">pet</text>
      </g>

      <!-- overlay -->
      <circle cx="24" cy="24" r="6" fill="#ef4444"/>
      <text x="38" y="29" font-size="14" font-weight="600" fill="#e2e8f0">Front Door</text>
      <text x="398" y="29" font-size="13" fill="#94a3b8" text-anchor="end">23:41:07</text>
    </g>
  </g>
</svg>
